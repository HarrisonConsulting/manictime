[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manictime"
version = "0.1.0"
description = "Python client for the ManicTime API"
requires-python = ">=3.8"
dependencies = [
    "requests",
    "requests-ntlm",
    "python-dotenv",
    "backoff",
]

[tool.setuptools]
packages = { find = {} }